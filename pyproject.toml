[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "balloon-optimization"
version = "0.1.0"
description = "G.B. Bronfeld's Inflatable Balloon Method (МНШ) for optimal production-plan distribution"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

# scipy is only needed for the exact LP reference oracle (balloon.exact) and the
# test suite, never for the balloon method itself.
[project.optional-dependencies]
exact = ["scipy>=1.7"]
test = ["scipy>=1.7"]

[tool.setuptools]
packages = ["balloon"]
